<title>健康手账</title>
<style>
/* ============ Design Tokens ============ */
:root{
  --bg:#F2F5F1;
  --card:#FFFFFF;
  --card-2:#F5F8F4;
  --text:#1E2A25;
  --text-2:#5C6A63;
  --text-3:#98A5A0;
  --primary:#0E9F6E;
  --primary-deep:#0B7C56;
  --primary-soft:#E2F4EB;
  --border:#E6ECE7;
  --amber:#E8962A;--amber-soft:#FBF1DF;
  --brown:#A06B42;--brown-soft:#F5ECE0;
  --blue:#3E7CFA;--blue-soft:#E8EFFD;
  --red:#DE4B4B;--red-soft:#FCECEC;
  --shadow:0 1px 2px rgba(30,42,37,.04),0 6px 20px rgba(30,42,37,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:#E9EFEA;color:var(--text);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit}
body.locked{overflow:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* ============ Pages ============ */
.page{display:none;padding:18px 16px 112px;animation:pageIn .3s ease-out}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#page-home{position:relative}
#page-home::before{content:'';position:absolute;top:-80px;left:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(14,159,110,.16),transparent);pointer-events:none}
#page-home::after{content:'';position:absolute;top:-40px;right:-80px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(232,150,42,.13),transparent);pointer-events:none}

.page-head{margin:6px 2px 14px}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.page-sub{font-size:13px;color:var(--text-3);margin-top:3px}

.home-head{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 2px 16px;position:relative}
.home-hi{font-size:24px;font-weight:800;letter-spacing:.3px}
.home-date{font-size:13px;color:var(--text-3);margin-top:4px}
.brand{font-size:12px;font-weight:700;color:var(--primary-deep);background:rgba(255,255,255,.75);border:1px solid var(--border);padding:5px 11px;border-radius:999px;margin-top:4px}

/* ============ Cards ============ */
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-t{font-size:15.5px;font-weight:700}
.card-s{font-size:11.5px;color:var(--text-3);margin-top:1px}
.link-btn{font-size:12px;font-weight:700;color:var(--primary-deep);background:var(--primary-soft);padding:6px 12px;border-radius:999px;flex:none}
.link-btn:active{transform:scale(.94)}
.foot-note{text-align:center;font-size:11.5px;color:var(--text-3);line-height:1.8;padding:6px 0 12px}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(14,159,110,.28)}
.btn-ghost{background:var(--primary-soft);color:var(--primary-deep)}
.btn-danger{background:var(--red);color:#fff}
.btn-white{background:#fff;color:var(--primary-deep)}
.btn-line{border:1.5px solid rgba(255,255,255,.65);color:#fff}
.btn-block{width:100%;margin-bottom:14px}
.btn.sm{height:34px;padding:0 14px;font-size:13px}

/* ============ Onboarding ============ */
.onboard{background:linear-gradient(150deg,#12A876,#0B7C56);color:#fff;border-radius:22px;padding:22px 18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(11,124,86,.25)}
.onboard h2{font-size:19px;font-weight:800;margin-bottom:8px}
.onboard p{font-size:13px;opacity:.94;line-height:1.7}
.onboard-btns{display:flex;gap:10px;margin-top:16px}
.onboard-btns .btn{flex:1;height:40px;font-size:13.5px;padding:0 8px}

/* ============ Home tiles ============ */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--tc);background:var(--tcbg);margin-bottom:10px}
.tile-ic svg{width:20px;height:20px}
.tile-label{font-size:12px;color:var(--text-3);font-weight:600}
.tile-value{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 3px;letter-spacing:.2px}
.tile-value small{font-size:11px;font-weight:600;color:var(--text-3);margin-left:2px}
.tile-sub{font-size:11.5px;color:var(--text-3)}
.tile-sub.good{color:var(--primary-deep);font-weight:600}

/* checklist */
.check-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--border)}
.check-row:first-of-type{padding-top:4px}
.check-row:last-of-type{border-bottom:none;padding-bottom:2px}
.check-emoji{width:38px;height:38px;border-radius:12px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.check-name{flex:1;font-size:14.5px;font-weight:600}
.check-done{display:inline-flex;align-items:center;justify-content:center;color:var(--primary-deep);background:var(--primary-soft);width:30px;height:30px;border-radius:999px}
.check-done svg{width:15px;height:15px}
.check-go{display:inline-flex;align-items:center;color:var(--text-3);font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--card-2)}
.check-go:active{color:var(--primary-deep);background:var(--primary-soft)}

/* stat chips */
.chips-stat{display:flex;flex-wrap:wrap;gap:8px}
.schip{background:var(--card-2);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--text-2)}
.schip b{color:var(--text);font-weight:800;padding:0 1px}

.chart-empty{padding:32px 8px;text-align:center;color:var(--text-3);font-size:12.5px;border:1.5px dashed var(--border);border-radius:14px;margin:4px 0 2px;line-height:1.7}
.tip-card{background:var(--amber-soft);color:#8A6210;border-radius:16px;padding:12px 14px;font-size:12.5px;font-weight:500;line-height:1.65;margin-bottom:14px}
.tip-line{font-size:12.5px;color:var(--text-2);margin-top:12px;padding-top:11px;border-top:1px dashed var(--border);line-height:1.6}
.remind-card{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:#8A6210;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.6}
.remind-card svg{width:18px;height:18px;flex:none;margin-top:2px}
.remind-card.red{background:var(--red-soft);color:#B23B3B}

/* ============ Date nav ============ */
.dnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:7px 8px;margin-bottom:14px;box-shadow:var(--shadow)}
.dnav-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.dnav-btn:active{background:var(--card-2)}
.dnav-btn:disabled{opacity:.28}
.dnav-btn svg{width:19px;height:19px}
.dnav-label{font-weight:700;font-size:15px;background:none;padding:6px 8px;border-radius:10px}
.dnav-label.ghost{color:var(--text-2)}
.dnav-label:active{background:var(--card-2)}

/* ---- 日历 ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-weight:700;font-size:16px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--text-3);font-size:12px;margin-bottom:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14.5px;border-radius:11px;background:none;color:var(--text-1)}
.cal-cell:active{background:var(--card-2)}
.cal-cell.blank{pointer-events:none}
.cal-cell:disabled{color:var(--text-3);opacity:.45}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--primary);font-weight:700}
.cal-cell.sel{background:var(--primary);color:#fff;font-weight:700}
.cal-dot{position:absolute;bottom:4.5px;left:50%;transform:translateX(-50%);width:4.5px;height:4.5px;border-radius:50%;background:var(--primary)}
.cal-cell.sel .cal-dot{background:#fff}
.cal-foot{display:flex;justify-content:center;margin-top:12px}

/* ---- 每日小记 ---- */
.journal-text{white-space:pre-wrap;word-break:break-word;line-height:1.65;font-size:14.5px;color:var(--text);max-height:11em;overflow-y:auto;padding:2px 2px 4px}
.journal-empty{color:var(--text-3);font-size:13.5px;padding:4px 2px}
.j-cnt{display:block;text-align:right}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn:active{background:var(--border)}
.icon-btn svg{width:18px;height:18px}
.head-actions{display:flex;align-items:center;gap:10px}

/* ============ Meals ============ */
.meal-head{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.meal-ic{width:40px;height:40px;border-radius:13px;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.meal-breakfast{background:linear-gradient(135deg,#FFF3DC,#FFE7BF)}
.meal-lunch{background:linear-gradient(135deg,#FFE9D6,#FFD9AD)}
.meal-dinner{background:linear-gradient(135deg,#E3ECFF,#D2DFFC)}
.meal-snack{background:linear-gradient(135deg,#E7F7EE,#D5F0E1)}
.meal-name{font-size:15px;font-weight:700}
.meal-hint{font-size:11.5px;color:var(--text-3)}
.add-mini{width:34px;height:34px;border-radius:11px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;margin-left:auto;flex:none;transition:transform .12s}
.add-mini:active{transform:scale(.9)}
.add-mini svg{width:17px;height:17px}
.meal-item{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-bottom:1px dashed var(--border);cursor:pointer}
.meal-item:last-child{border-bottom:none}
.mi-time{font-size:11px;font-weight:700;color:var(--text-2);background:var(--card-2);padding:3px 7px;border-radius:7px;margin-top:2px;flex:none;font-variant-numeric:tabular-nums}
.mi-main{flex:1;min-width:0}
.mi-content{font-size:14px;font-weight:500;word-break:break-word;line-height:1.5}
.mi-tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;color:var(--text-2);background:var(--card-2);padding:2.5px 8px;border-radius:999px}
.mi-del{width:26px;height:26px;border-radius:9px;color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;opacity:.75}
.mi-del svg{width:13px;height:13px}
.mi-del:active{color:var(--red);background:var(--red-soft)}
.meal-empty{font-size:12.5px;color:var(--text-3);padding:9px 2px 4px}
.empty{padding:24px 8px;text-align:center;color:var(--text-3);font-size:13px}
.empty-emoji{font-size:30px;margin-bottom:8px}

/* weight card */
.w-card{display:flex;align-items:center;gap:12px}
.w-ic{width:44px;height:44px;border-radius:14px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;flex:none}
.w-ic svg{width:22px;height:22px}
.w-main{flex:1;min-width:0}
.w-label{font-size:12px;color:var(--text-3);font-weight:600}
.w-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.w-value small{font-size:12px;color:var(--text-3);font-weight:600;margin-left:2px}
.w-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.bmi-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:3px}
.bmi-tag.good{background:var(--primary-soft);color:var(--primary-deep)}
.bmi-tag.amber{background:var(--amber-soft);color:#8A6210}
.bmi-tag.red{background:var(--red-soft);color:#B23B3B}

/* ============ Bowel ============ */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3-item{text-align:center;padding:10px 4px 9px;background:var(--card-2);border-radius:14px}
.stat3-num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat3-lab{font-size:11px;color:var(--text-3);margin-top:2px}

/* records list */
.rec{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.rec:first-of-type{padding-top:6px}
.rec:last-child{border-bottom:none}
.rec-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.rec-ic svg{width:19px;height:19px}
.rec-ic.emoji{font-size:18px}
.bowels-bg{background:var(--brown-soft);color:var(--brown)}
.meals-bg{background:var(--amber-soft);color:#B4731F}
.weights-bg{background:var(--primary-soft);color:var(--primary-deep)}
.walks-bg{background:var(--blue-soft);color:#2D5FD9}
.dailies-bg{background:var(--card-2);color:var(--text-2)}
.rec-main{flex:1;min-width:0}
.rec-t{font-size:14px;font-weight:600;word-break:break-word}
.rec-s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.rec-del{width:30px;height:30px;border-radius:10px;color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none}
.rec-del svg{width:15px;height:15px}
.rec-del:active{color:var(--red);background:var(--red-soft)}

/* ============ Walk ============ */
.walk-hero{text-align:center}
.ring-wrap{position:relative;width:152px;height:152px;margin:10px auto 4px}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-v{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.ring-l{font-size:11px;color:var(--text-3);margin-top:2px}
.goal-hit{color:var(--primary-deep);font-weight:800;font-size:13.5px;margin-top:4px}
.pace-row{display:flex;align-items:center;gap:8px;background:var(--blue-soft);border-radius:12px;padding:10px 14px;font-size:13px;color:#2D5FD9;font-weight:600;margin:-6px 0 16px}
.pace-row b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.pace-tip{font-size:10.5px;color:var(--text-3);font-weight:400}
.walk-kcal{margin-top:12px;background:var(--card-2);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--text-2)}
.walk-kcal b{color:var(--text);font-weight:800}
.goal-sub{color:var(--text-3);font-size:12.5px;margin-top:4px}
.walk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats2x2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ws{background:var(--card-2);border-radius:14px;padding:11px 4px}
.ws-v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.ws-l{font-size:11px;color:var(--text-3);margin-top:2px}

/* ============ Data page ============ */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
.set-row.noline{border-bottom:none}
.set-lab{flex:1;font-size:14px;font-weight:600}
.set-in{width:150px;height:42px;text-align:right}
.bmi-card{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border-radius:14px;padding:12px 14px;margin-top:12px}
.bmi-v{font-size:13px;font-weight:600;color:var(--text-2)}
.bmi-v b{font-size:19px;font-weight:800;color:var(--text);margin-left:4px}
.bmi-s{font-size:11px;color:var(--text-3);margin-top:2px}
.bmi-badge{font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;flex:none}
.bmi-badge.good{background:var(--primary-soft);color:var(--primary-deep)}
.bmi-badge.amber{background:var(--amber-soft);color:#8A6210}
.bmi-badge.red{background:var(--red-soft);color:#B23B3B}
.data-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.dg{background:var(--card-2);border-radius:14px;padding:11px 2px;text-align:center}
.dg-e{font-size:18px}
.dg-v{font-size:16px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.dg-l{font-size:10.5px;color:var(--text-3)}
.stat-line{text-align:center;font-size:12px;color:var(--text-2)}
.stat-line b{font-weight:800;color:var(--text)}
.mg-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--border);cursor:pointer}
.mg-row:last-child{border-bottom:none}
.mg-row:active{background:var(--card-2);border-radius:12px}
.mg-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--card-2);color:var(--text-2);flex:none}
.mg-ic svg{width:18px;height:18px}
.mg-main{flex:1;min-width:0}
.mg-name{font-size:14px;font-weight:600}
.mg-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.mg-row.danger .mg-ic{background:var(--red-soft);color:var(--red)}
.mg-row.danger .mg-name{color:var(--red)}
/* ---- 云同步卡片 ---- */
.sync-ic{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center}
.sync-ic svg{width:20px;height:20px}
.sync-or{text-align:center;color:var(--text-3);font-size:12px;margin:12px 0}
.sync-bind{display:flex;gap:8px}
.sync-bind .input{flex:1;min-width:0;text-transform:uppercase;font-weight:600;letter-spacing:.5px}
.sync-tip{font-size:11.5px;color:var(--text-3);line-height:1.7;margin-top:10px}
.sync-tip b{color:var(--text-2)}
.sync-code-row{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.sync-code{flex:1;min-width:0;font-weight:800;font-size:15.5px;letter-spacing:1.5px;color:var(--primary-deep);background:var(--primary-soft);border-radius:13px;padding:12px 14px;cursor:pointer;user-select:all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#C7D2CC;flex:none}
.sync-dot.ok{background:var(--primary)}
.sync-dot.syncing{background:var(--amber);animation:sync-pulse 1s ease-in-out infinite}
.sync-dot.error{background:var(--red)}
@keyframes sync-pulse{50%{opacity:.3}}
.sync-status{font-size:12.5px;color:var(--text-2);margin-bottom:12px;min-height:18px}
.sync-btns{display:flex;gap:8px}
.sync-btns .btn{flex:1}
.btn-ghost-danger{background:var(--red-soft);color:var(--red)}
.mg-arrow{color:var(--text-3);font-size:16px;flex:none}

/* ============ Nav ============ */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;color:var(--text-3);transition:color .18s,background .18s}
.nav-item svg{width:23px;height:23px}
.nav-item span{font-size:10.5px;font-weight:700;letter-spacing:.3px}
.nav-item.active{color:var(--primary-deep);background:var(--primary-soft)}

/* ============ Bottom sheet ============ */
.sheet-mask{position:fixed;inset:0;background:rgba(18,26,22,.5);z-index:90;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet-mask.show{opacity:1}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:480px;background:var(--card);
  border-radius:26px 26px 0 0;z-index:95;transition:transform .32s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;max-height:88vh;box-shadow:0 -8px 40px rgba(0,0,0,.14);
  padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.sheet.open{transform:translate(-50%,0)}
.sheet-handle{width:42px;height:4.5px;border-radius:99px;background:var(--border);margin:10px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;flex:none}
.sheet-title{font-size:17px;font-weight:800}
.sheet-close{width:32px;height:32px;border-radius:11px;background:var(--card-2);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.sheet-close svg{width:15px;height:15px}
.sheet-body{overflow-y:auto;padding:10px 18px 4px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 18px 0;flex:none}
.sheet-hint{font-size:12px;color:var(--text-3);background:var(--card-2);border-radius:12px;padding:9px 12px;margin-bottom:14px;line-height:1.6}

/* form fields */
.field{margin-bottom:16px}
.field>label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:8px}
.input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:14px;padding:0 14px;background:var(--card-2);font-size:16px;transition:border-color .2s,background .2s}
.input:focus{border-color:var(--primary);outline:none;background:#fff}
textarea.input{height:auto;padding:12px 14px;min-height:86px;resize:none;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;border-radius:999px;background:var(--card-2);border:1.5px solid var(--border);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--text-2);transition:all .15s}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep)}
.chip:active{transform:scale(.95)}
.big-input-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;background:var(--card-2);border-radius:16px;padding:20px 10px}
.big-num{font-size:40px;font-weight:800;width:170px;text-align:center;border:none;background:transparent;outline:none;color:var(--text);font-variant-numeric:tabular-nums}
.big-num::placeholder{color:#C7D2CC}
.unit{font-size:15px;font-weight:700;color:var(--text-3)}

/* bristol */
.bristol{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.br-item{border:1.5px solid var(--border);border-radius:15px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s;background:#fff}
.br-item.on{border-color:var(--brown);background:var(--brown-soft);box-shadow:0 0 0 3px rgba(160,107,66,.08)}
.br-glyph{color:#9A6B45;height:24px;display:flex;align-items:center}
.br-glyph svg{width:44px;height:24px}
.br-num{font-size:12px;font-weight:800;color:var(--brown)}
.br-item.on .br-num{color:var(--brown)}
.br-name{font-size:10.5px;color:var(--text-2);line-height:1.3}
.br-hint{font-size:12px;color:var(--text-2);background:var(--brown-soft);border-radius:12px;padding:9px 12px;margin-top:6px;line-height:1.6}
.br-hint b{color:var(--brown)}
.hint-warn{background:var(--red-soft);color:#B23B3B;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;margin-top:10px}

/* dialog */
.dialog-mask{position:fixed;inset:0;background:rgba(18,26,22,.5);z-index:100;opacity:0;transition:opacity .22s}
.dialog-mask.show{opacity:1}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-44%) scale(.94);opacity:0;width:min(80vw,330px);background:#fff;border-radius:22px;padding:20px 18px 16px;z-index:105;transition:all .22s cubic-bezier(.3,.8,.4,1);box-shadow:0 20px 60px rgba(0,0,0,.22)}
.dialog.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.dlg-title{font-size:16.5px;font-weight:800;text-align:center}
.dlg-msg{font-size:13.5px;color:var(--text-2);line-height:1.65;text-align:center;margin:8px 0 16px}
.dlg-btns{display:flex;gap:10px}
.dlg-btns .btn{flex:1;height:42px;font-size:14px}

/* toast */
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-16px);opacity:0;background:#22312A;color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .28s cubic-bezier(.3,.8,.4,1);pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:#8A5A10}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <main>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-meals"></section>
    <section class="page" id="page-bowel"></section>
    <section class="page" id="page-walk"></section>
    <section class="page" id="page-data"></section>
  </main>
  <nav class="nav" id="nav" aria-label="主导航"></nav>
</div>
<div id="sheetRoot"></div>
<div id="dialogRoot"></div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ================= 基础数据层 ================= */
const KEY='health_diary_v1';
const DEF_SETTINGS={nickname:'',height:0,stepGoal:8000};
function loadDB(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&typeof d==='object'){
      return {meals:Array.isArray(d.meals)?d.meals:[],weights:Array.isArray(d.weights)?d.weights:[],
              bowels:Array.isArray(d.bowels)?d.bowels:[],walks:Array.isArray(d.walks)?d.walks:[],
              dailies:Array.isArray(d.dailies)?d.dailies:[],journals:Array.isArray(d.journals)?d.journals:[],
              deleted:Array.isArray(d.deleted)?d.deleted:[],
              settings:Object.assign({},DEF_SETTINGS,d.settings||{})};
    }
  }catch(e){}
  return {meals:[],weights:[],bowels:[],walks:[],dailies:[],journals:[],deleted:[],settings:Object.assign({},DEF_SETTINGS)};
}
let db=loadDB();

/* ================= 云同步（同步码模式） ================= */
const SYNC_CONF_KEY='health_diary_sync';
const SYNC_ROOT='https://textdb.dev/api/data/';
const TYPES=['meals','weights','bowels','walks','dailies','journals'];
let syncConf=null,syncing=false,syncDebTimer=null,syncStatus='ok',syncErrMsg='';
try{const sc=JSON.parse(localStorage.getItem(SYNC_CONF_KEY));if(sc&&sc.code&&sc.k)syncConf=sc}catch(e){}
function saveSyncConf(){try{localStorage.setItem(SYNC_CONF_KEY,JSON.stringify(syncConf))}catch(e){}}
function markDirty(){
  if(!syncConf||syncing)return;
  clearTimeout(syncDebTimer);
  syncDebTimer=setTimeout(()=>syncNow(),2500);
}
/* 迁移：为旧记录补 updatedAt（按记录日期时间推导），确保可合并 */
function recStamp(r){
  if(!r.updatedAt){
    const t=String(r.time||'00:00').split(':');
    r.updatedAt=parseD(r.date).getTime()+(+t[0])*36e5+(+t[1])*6e4;
  }
  return r;
}
/* 迁移：为旧记录补 updatedAt（按记录日期时间推导），确保可合并
   注意：只能在全部工具函数初始化后调用（见启动区），避免声明时序问题 */
function migrateDB(){
  if(!Array.isArray(db.deleted))db.deleted=[];

/* ---- 加密工具（Web Crypto, AES-GCM） ---- */
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const te=new TextEncoder();
async function shaHex(str){
  const buf=await crypto.subtle.digest('SHA-256',te.encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function deriveKey(code){
  const base=await crypto.subtle.importKey('raw',te.encode(code),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('health-diary-sync-v1'),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encDoc(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));
  return {v:1,iv:b64(iv),ct:b64(new Uint8Array(ct))};
}
async function decDoc(key,doc){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(doc.iv)},key,unb64(doc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* ---- 同步码 ---- */
const CODE_ALPHABET='ABCDEFGHJKMNPQRSTVWXYZ23456789';
function genCode(){
  const buf=crypto.getRandomValues(new Uint8Array(16));
  let s='';for(const b of buf)s+=CODE_ALPHABET[b%CODE_ALPHABET.length];
  return s;
}
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtCode=c=>String(c).replace(/(.{4})/g,'$1-').replace(/-$/,'');

/* ---- 同步载荷 / 合并 ---- */
function buildPayload(){
  const p={v:1,at:Date.now(),settings:Object.assign({},db.settings),deleted:(db.deleted||[]).map(d=>Object.assign({},d))};
  TYPES.forEach(t=>{p[t]=(db[t]||[]).map(r=>recStamp(Object.assign({},r)))});
  return p;
}
function canonSettings(s){const o={};Object.keys(s||{}).filter(k=>k!=='updatedAt').sort().forEach(k=>o[k]=s[k]);return JSON.stringify(o)}
function canon(p){
  const q={settings:canonSettings(p.settings),deleted:(p.deleted||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)))};
  TYPES.forEach(t=>q[t]=(p[t]||[]).map(r=>{const c={};Object.keys(r).filter(k=>k!=='updatedAt').sort().forEach(k=>c[k]=r[k]);return c}).sort((a,b)=>String(a.id).localeCompare(String(b.id))));
  return JSON.stringify(q);
}
function mergePayload(cloud){
  const delMap=new Map();
  [...(db.deleted||[]),...(cloud.deleted||[])].forEach(d=>{if(!d||!d.id)return;delMap.set(d.id,Math.max(delMap.get(d.id)||0,+d.at||0))});
  TYPES.forEach(t=>{
    const map=new Map();
    db[t].forEach(r=>{recStamp(r);map.set(r.id,r)});
    (cloud[t]||[]).forEach(r=>{
      if(!r||!r.id)return;recStamp(r);
      const cur=map.get(r.id);
      if(!cur)map.set(r.id,Object.assign({},r));
      else if((r.updatedAt||0)>(cur.updatedAt||0))map.set(r.id,Object.assign({},r));
    });
    db[t]=[...map.values()].filter(r=>{const at=delMap.get(r.id);return !(at&&(r.updatedAt||0)<=at)});
  });
  const cs=cloud.settings;
  if(cs&&(cs.updatedAt||0)>(db.settings.updatedAt||0)&&canonSettings(cs)!==canonSettings(db.settings)){
    db.settings=Object.assign({},DEF_SETTINGS,cs);
  }
  db.deleted=[...delMap.entries()].map(([id,at])=>({id,at})).sort((a,b)=>a.at-b.at).slice(-400);
}
/* ---- 同步主流程 ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fetchT=(url,opt)=>{
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),20000);
  return fetch(url,Object.assign({signal:c.signal},opt)).finally(()=>clearTimeout(t));
};
let syncRetryTimer=null;
function scheduleSyncRetry(){
  clearTimeout(syncRetryTimer);
  syncRetryTimer=setTimeout(()=>{if(syncConf&&syncStatus==='error')syncNow()},45000);
}
async function syncNow(manual){
  if(!syncConf){return}
  if(syncing){if(manual)toast('正在同步中…');return}
  if(!(window.crypto&&crypto.subtle)){setSyncStatus('nocrypto');if(manual)toast('当前环境不支持加密，无法同步','warn');return}
  syncing=true;setSyncStatus('syncing');
  try{
    const key=await deriveKey(syncConf.code);
    const url=SYNC_ROOT+syncConf.k;
    let raw=null;
    const res=await fetchT(url,{cache:'no-store'});
    if(res.ok)raw=await res.text();
    else if(res.status!==404)throw new Error('网络异常（'+res.status+'）');
    let cloud=null;
    if(raw){
      let doc=null;try{doc=JSON.parse(raw)}catch(e){}
      if(doc&&doc.v===1&&doc.ct&&doc.iv){
        try{cloud=await decDoc(key,doc)}
        catch(e){setSyncStatus('codeerr');if(manual)toast('同步码不匹配，云端数据无法解密','warn');syncing=false;refreshSyncUI();return}
      }
    }
    const before=canon(buildPayload());
    if(cloud){mergePayload(cloud);migrateWalks()}
    const afterP=buildPayload();
    const after=canon(afterP);
    if(after!==before){save();render(cur)}
    if(!cloud||after!==canon(cloud)){
      const doc=await encDoc(key,afterP);
      const pr=await fetchT(url,{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify(doc)});
      if(!pr.ok)throw new Error('推送失败（'+pr.status+'）');
    }
    syncConf.lastSync=Date.now();
    syncConf.total=TYPES.reduce((a,t)=>a+(afterP[t]||[]).length,0);
    saveSyncConf();
    clearTimeout(syncRetryTimer);
    setSyncStatus('ok');
    if(manual)toast('已同步 ✓ · 云端与本机一致（共 '+syncConf.total+' 条记录）');
  }catch(e){
    syncErrMsg=(e&&e.message)||'同步失败';
    setSyncStatus('error');
    scheduleSyncRetry();
    if(manual)toast('同步失败：'+syncErrMsg+'，45 秒后自动重试','warn');
  }finally{
    syncing=false;refreshSyncUI();
  }
}
function setSyncStatus(s){syncStatus=s;refreshSyncUI()}
function fmtSyncTime(ts){
  if(!ts)return '尚未同步';
  const d=Date.now()-ts;
  if(d<60e3)return '刚刚';
  if(d<3600e3)return Math.floor(d/60e3)+' 分钟前';
  const t=new Date(ts);return pad(t.getHours())+':'+pad(t.getMinutes());
}
function syncStatusHTML(){
  if(!syncConf)return '';
  if(syncStatus==='syncing')return '⟳ 正在同步…';
  if(syncStatus==='error')return '⚠ 同步失败：'+syncErrMsg+'，稍后自动重试';
  if(syncStatus==='codeerr')return '⚠ 同步码不匹配，云端数据无法解密';
  if(syncStatus==='nocrypto')return '⚠ 当前环境不支持加密';
  return '✓ 已同步'+(syncConf.total!=null?' · 共 '+syncConf.total+' 条':'')+' · '+fmtSyncTime(syncConf.lastSync);
}
function refreshSyncUI(){
  const dot=$('#syncDot'),txt=$('#syncStatusText');
  if(!dot||!txt||!syncConf)return;
  dot.className='sync-dot '+(syncStatus==='ok'?'ok':syncStatus==='syncing'?'syncing':'error');
  txt.innerHTML=syncStatusHTML();
}
/* ---- 同步操作 ---- */
function syncGen(){
  (async()=>{
    const code=genCode();
    syncConf={code,k:await shaHex(code),lastSync:0};
    saveSyncConf();
    renderData();
    toast('同步码已生成，正在上传加密数据…');
    await syncNow(true);
  })();
}
async function syncBind(){
  const input=$('#syncCodeInput');
  const code=normCode(input&&input.value);
  if(code.length!==16){toast('同步码格式不对：16 位字符（输入时横杠可省略）','warn');return}
  if(!window.fetch){toast('此环境不支持网络请求','warn');return}
  try{
    const k=await shaHex(code);
    let doc=null;
    const grab=async()=>{const res=await fetchT(SYNC_ROOT+k,{cache:'no-store'});if(res.ok){try{doc=JSON.parse(await res.text())}catch(e){}}};
    await grab();
    if(!doc||!doc.ct||!doc.iv){await sleep(3500);await grab()}
    if(doc&&doc.ct&&doc.iv){
      try{await decDoc(await deriveKey(code),doc)}
      catch(e){toast('同步码不正确：无法解密云端数据','warn');return}
    }
    syncConf={code,k,lastSync:0};
    saveSyncConf();
    renderData();
    toast(doc?'绑定成功，正在拉取云端数据':'云端暂无数据（请先在生成同步码的设备看到「✓ 已同步」，再回来点「立即同步」）');
    await syncNow(true);
  }catch(e){toast('无法连接同步服务，请稍后再试','warn')}
}
function copyText(t){
  return new Promise(resolve=>{
    const done=()=>resolve(true);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback())}
    else fallback();
    function fallback(){
      const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy')}catch(e){}
      ta.remove();done();
    }
  });
}
function copySyncCode(){
  if(!syncConf)return;
  copyText(fmtCode(syncConf.code)).then(()=>toast('同步码已复制，请在其他设备粘贴绑定'));
}
function syncRotate(){
  if(!syncConf)return;
  confirmDialog({title:'更换同步码',msg:'将生成新同步码并重新上传全部数据，旧同步码的云端数据会被清空。其他设备需要用新码重新绑定。',okText:'换新码',
    onOk:(async()=>{
      const old=syncConf;
      const code=genCode();
      syncConf={code,k:await shaHex(code),lastSync:0};
      saveSyncConf();
      await syncNow();
      try{await fetch(SYNC_ROOT+old.k,{method:'POST',headers:{'content-type':'text/plain'},body:' '})}catch(e){}
      renderData();
      toast('已更换同步码，记得在其他设备重新绑定');
    })});
}
function syncOff(){
  if(!syncConf)return;
  confirmDialog({title:'关闭云同步',msg:'将清空云端加密数据并停止自动同步，本机数据不受任何影响。',okText:'关闭',danger:true,
    onOk:(async()=>{
      try{await fetch(SYNC_ROOT+syncConf.k,{method:'POST',headers:{'content-type':'text/plain'},body:' '})}catch(e){}
      syncConf=null;localStorage.removeItem(SYNC_CONF_KEY);
      renderData();
      toast('云同步已关闭');
    })});
}

/* ================= 图表 ================= */
let _gid=0;
function svgLine(items,opt){
  const color=(opt&&opt.color)||'#0E9F6E';
  const W=340,H=148,L=14,R=40,T=18,B=26;
  const n=items.length;
  if(n===0)return '<div class="chart-empty">记录体重后这里会显示趋势</div>';
  const vals=items.map(i=>i.value);
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1}
  const p=(mx-mn)*.15;mn-=p;mx+=p;
  const iw=W-L-R,ih=H-T-B;
  const X=i=>n===1?L+iw/2:L+iw*i/(n-1);
  const Y=v=>T+ih*(1-(v-mn)/(mx-mn));
  const lineD=items.map((it,i)=>(i?'L':'')+X(i).toFixed(1)+' '+Y(it.value).toFixed(1)).join(' ');
  const areaD=lineD+` L${X(n-1).toFixed(1)} ${(T+ih).toFixed(1)} L${X(0).toFixed(1)} ${(T+ih).toFixed(1)} Z`;
  const id='lg'+(++_gid);
  const dots=items.map((it,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(it.value).toFixed(1)}" r="3.2" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('');
  const labels=items.map((it,i)=>{
    const showX=n<=7||i===0||i===n-1;
    const showV=n<=5||i===0||i===n-1;
    let s='';
    if(showX)s+=`<text x="${X(i).toFixed(1)}" y="${H-7}" font-size="9" fill="#98A5A0" text-anchor="middle">${items[i].label}</text>`;
    if(showV){const y=Y(it.value);const above=y>28;s+=`<text x="${X(i).toFixed(1)}" y="${(above?y-9:y+17).toFixed(1)}" font-size="10.5" font-weight="700" fill="#5C6A63" text-anchor="middle">${fmt1(it.value)}</text>`}
    return s;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".20"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaD}" fill="url(#${id})"/>
    <path d="${lineD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}</svg>`;
}
function svgBars(items,opt){
  const color=(opt&&opt.color)||'#3E7CFA';
  const goal=(opt&&opt.goal)||0;
  const W=340,H=148,T=20,B=24,L=4,R=4;
  const mx=Math.max(goal,...items.map(i=>i.value),1)*1.18;
  const ih=H-T-B;
  const slot=(W-L-R)/items.length;
  const bw=Math.min(26,slot*.52);
  let bars='',vLbl='',xLbl='';
  items.forEach((it,i)=>{
    const x=L+slot*i+(slot-bw)/2;
    const h=Math.max(it.value>0?4:2,ih*it.value/mx);
    const y=T+ih-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6,bw/2).toFixed(1)}" fill="${color}" fill-opacity="${it.today?1:.28}"/>`;
    if(it.value>0)vLbl+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9" font-weight="${it.today?700:500}" fill="${it.today?color:'#98A5A0'}" text-anchor="middle">${shortNum(it.value)}</text>`;
    xLbl+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" font-size="9" font-weight="${it.today?700:400}" fill="${it.today?color:'#98A5A0'}" text-anchor="middle">${it.label}</text>`;
  });
  let goalLine='';
  if(goal>0&&goal<=mx){
    const gy=T+ih*(1-goal/mx);
    goalLine=`<path d="M${L} ${gy.toFixed(1)} H${W-R}" stroke="#E8962A" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${W-R-2}" y="${(gy-5).toFixed(1)}" font-size="8.5" fill="#E8962A" text-anchor="end" font-weight="600">目标 ${shortNum(goal)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${bars}${goalLine}${vLbl}${xLbl}</svg>`;
}
function svgRing(pct,opt){
  opt=opt||{};
  const size=opt.size||152,stroke=opt.stroke||12,color=opt.color||'#3E7CFA',track=opt.track||'#E8EFFD';
  pct=Math.max(0,Math.min(1,pct));
  const r=(size-stroke)/2-2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${(c*pct).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

/* ================= Sheet / Dialog / Toast ================= */
const sheetRoot=$('#sheetRoot'),dialogRoot=$('#dialogRoot');
let sheetSubmit=null;
function openSheet(o){
  sheetRoot.innerHTML=`
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="${o.title}">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">${o.title}</div>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">${ic('x')}</button></div>
    <form class="sheet-body" id="sheetForm" novalidate>${o.html}</form>
    ${o.noSubmit?'':`<div class="sheet-foot"><button type="submit" form="sheetForm" class="btn btn-primary btn-block" style="margin-bottom:2px">${o.submitText||'保存'}</button></div>`}
  </div>`;
  sheetSubmit=o.onSubmit||null;
  document.body.classList.add('locked');
  requestAnimationFrame(()=>{const m=$('#sheetMask'),s=$('#sheet');if(m)m.classList.add('show');if(s)s.classList.add('open')});
  $('#sheetMask').addEventListener('click',closeSheet);
  $('#sheetClose').addEventListener('click',closeSheet);
  $('#sheetForm').addEventListener('submit',e=>{
    e.preventDefault();
    if(sheetSubmit()!==false)closeSheet();
  });
  document.addEventListener('keydown',escClose);
}
function escClose(e){if(e.key==='Escape')closeSheet()}
function closeSheet(){
  const m=$('#sheetMask'),s=$('#sheet');
  if(!s)return;
  if(m)m.classList.remove('show');
  s.classList.remove('open');
  document.body.classList.remove('locked');
  document.removeEventListener('keydown',escClose);
  setTimeout(()=>{sheetRoot.innerHTML=''},300);
}
function confirmDialog(o){
  dialogRoot.innerHTML=`
  <div class="dialog-mask" id="dlgMask"></div>
  <div class="dialog" id="dlg" role="alertdialog" aria-modal="true">
    <div class="dlg-title">${o.title||'确认操作'}</div>
    <div class="dlg-msg">${o.msg}</div>
    <div class="dlg-btns">
      <button type="button" class="btn btn-ghost" id="dlgNo">取消</button>
      <button type="button" class="btn ${o.danger?'btn-danger':'btn-primary'}" id="dlgYes">${o.okText||'确定'}</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>{const m=$('#dlgMask'),d=$('#dlg');if(m)m.classList.add('show');if(d)d.classList.add('show')});
  const off=()=>{dialogRoot.innerHTML=''};
  $('#dlgNo').addEventListener('click',off);
  $('#dlgMask').addEventListener('click',off);
  $('#dlgYes').addEventListener('click',()=>{off();if(o.onOk)o.onOk()});
}
let toastTimer=null;
function toast(msg,type){
  const t=$('#toast');
  t.textContent=msg;

}

      if(!(mins>0)&&!(km>0)){toast('时长和距离至少填一项','warn');return false}
      const num=(id,mn,mx)=>{const s=$('#'+id).value.trim();if(!s)return null;const v=+s;return(v>=mn&&v<=mx)?v:'BAD'};
      const hr=num('wHr',40,220),hrMin=num('wHrMin',40,220),hrMax=num('wHrMax',40,220),kcal=num('wKcal',0,5000);
      if(hr==='BAD'||hrMin==='BAD'||hrMax==='BAD'||kcal==='BAD'){toast('心率 / 千卡的数值范围看起来不对','warn');return false}
      const rec={id:isEdit?entry.id:uid(),date:d,updatedAt:Date.now(),time:nowHM(),

    }
  });

let calY=0,calM=0;
function calHasSet(){
  const s=new Set();
  TYPES.forEach(t=>(db[t]||[]).forEach(r=>{if(r.date)s.add(r.date)}));
  return s;
}
function calMonthHTML(page){
  const sel=view[page]||todayStr(),t=todayStr();
  const has=calHasSet();
  const first=new Date(calY,calM,1);
  const startW=first.getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const cells=[];
  for(let i=0;i<startW;i++)cells.push('<span class="cal-cell blank"></span>');
  for(let i=1;i<=dim;i++){
    const ds=calY+'-'+pad(calM+1)+'-'+pad(i);
    const fut=ds>t;
    cells.push(`<button type="button" class="cal-cell${ds===t?' today':''}${ds===sel?' sel':''}" data-act="cal-day" data-page="${page}" data-d="${ds}" ${fut?'disabled':''} aria-label="${ds}">${i}${has.has(ds)?'<span class="cal-dot"></span>':''}</button>`);
  }
  const need=(Math.ceil(cells.length/7)*7)-cells.length;
  for(let i=0;i<need;i++)cells.push('<span class="cal-cell blank"></span>');
  return `<div class="cal-week">${'日一二三四五六'.split('').map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-foot"><button type="button" class="btn btn-ghost sm" data-act="cal-today" data-page="${page}">回到今天</button></div>`;
}
function openCalSheet(page){
  const d0=view[page]||todayStr();
  const p0=parseD(d0);
  calY=p0.getFullYear();calM=p0.getMonth();
  openSheet({
    title:'选择日期',
    noSubmit:true,
    html:`
      <div class="cal-head">
        <button type="button" class="dnav-btn" data-act="cal-shift" data-page="${page}" data-delta="-1" aria-label="上个月">${ic('chevL')}</button>
        <div class="cal-title" id="calTitle">${calY}年${calM+1}月</div>
        <button type="button" class="dnav-btn" data-act="cal-shift" data-page="${page}" data-delta="1" aria-label="下个月">${ic('chevR')}</button>
      </div>
      <div id="calBody">${calMonthHTML(page)}</div>`
  });
}
function calShift(delta,page){
  calM+=delta;
  if(calM<0){calM=11;calY--}
  if(calM>11){calM=0;calY++}
  const tt=$('#calTitle'),tb=$('#calBody');
  if(tt)tt.textContent=calY+'年'+(calM+1)+'月';
  if(tb)tb.innerHTML=calMonthHTML(page);
}

  return '形态适中，肠道状态不错，继续保持';

function sumOf(t,r){
  if(t==='meals')return esc(r.content)+(r.cal?` · ${r.cal} 千卡`:'');
  if(t==='weights')return `${fmt1(r.value)} kg`;
  if(t==='bowels')return `${r.bristol} 型 · ${easeName(r.ease)}`;
  if(t==='dailies')return `总步数 ${shortNum(r.steps)}${r.kcal?` · ${r.kcal} 千卡`:''}`;
  if(t==='journals'){const c=(r.content||'').replace(/\s+/g,' ');return esc(c.length>42?c.slice(0,42)+'…':c)}
  return `${r.mins?r.mins+' 分钟':''}${r.km?`${r.mins?' · ':''}${r.km} km`:''} · 配速 ${fmtPace(r.mins,r.km)}`;
}
function allRecords(){
  const out=[];
  for(const t of ['meals','weights','bowels','walks','dailies','journals'])db[t].forEach(r=>out.push({t,r}));
  out.sort((a,b)=>((b.r.date||'')+(b.r.time||'')).localeCompare((a.r.date||'')+(a.r.time||'')));
  return out;
}

/* ================= 数据操作 ================= */
function exportData(){
  try{
    const payload=Object.assign({},db,{app:'health-diary',version:1});
    if(syncConf)payload.sync={code:fmtCode(syncConf.code)};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`健康手账备份_${todayStr()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('备份文件已导出');
  }catch(e){toast('导出失败','warn')}
}
function doImport(inp){
  const file=inp.files&&inp.files[0];
  inp.value='';
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let d=null;
    try{d=JSON.parse(fr.result)}catch(e){}
    const ok=d&&typeof d==='object'&&['meals','weights','bowels','walks'].every(k=>Array.isArray(d[k]));
    if(!ok){toast('文件格式不正确，导入失败','warn');return}
    const n=d.meals.length+d.weights.length+d.bowels.length+d.walks.length;
    confirmDialog({title:'导入备份',msg:`备份中有 ${n} 条记录，导入后将覆盖当前全部数据和设置。确定继续吗？`,okText:'导入',onOk:()=>{
      db={meals:d.meals,weights:d.weights,bowels:d.bowels,walks:d.walks,dailies:Array.isArray(d.dailies)?d.dailies:[],journals:Array.isArray(d.journals)?d.journals:[],deleted:Array.isArray(d.deleted)?d.deleted:[],settings:Object.assign({},DEF_SETTINGS,d.settings||{})};
      save();go('home');toast('导入成功，共恢复 '+n+' 条记录');
      /* 备份里带同步码时，一并恢复绑定 */
      const code=normCode(d.sync&&d.sync.code);
      if(code.length===16){
        (async()=>{syncConf={code,k:await shaHex(code),lastSync:0};saveSyncConf();syncNow()})();
      }
    }});
  };
  fr.onerror=()=>toast('读取文件失败','warn');
  fr.readAsText(file);
}

      const br=[2,3,3,4,4,4,4,5,5,6][Math.floor(Math.random()*10)];
      db.bowels.push({id:uid(),date:d,time:rm(8,10),bristol:br,
        ease:br<=2?'hard':(br>=6?'easy':(Math.random()<.6?'normal':'easy')),
        color:['棕黄','棕黄','棕黄','深棕','深棕','墨绿'][Math.floor(Math.random()*6)],note:''});
    }
    if(i!==0&&Math.random()<.45){
      const notes=['上午开例会，下午整理了季度材料','下雨，在家做了半小时拉伸','和同事午饭散步 20 分钟','晚饭后散步，睡前看了一章书','整理房间，扔掉两箱旧物','陪爸妈逛了超市，走路来回','加班到八点，回家泡脚早睡'];
      db.journals.push({id:'jr-'+d,date:d,content:pick(notes),updatedAt:Date.now()});
    }
  }
}
function genDemo(){
  const has=db.meals.length||db.weights.length||db.bowels.length||db.walks.length;
  const run=()=>{buildDemo();save();go('home');toast('示例数据已生成 🌱')};
  if(has)confirmDialog({title:'生成示例数据',msg:'当前已有记录，示例数据会追加在现有数据之后，可随时在「清空全部记录」里删除。继续吗？',okText:'生成',onOk:run});
  else run();
}
function confirmDel(type,id){
  confirmDialog({title:'删除记录',msg:'删除后无法恢复，确定删除这条记录吗？',okText:'删除',danger:true,
    onOk:()=>{removeRecord(type,id);save();render(cur);toast('已删除')}});
}

/* ================= 事件绑定 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){
    const act=el.dataset.act,id=el.dataset.id;
    switch(act){
      case 'goto':go(el.dataset.page);break;
      case 'goto-date':{
        const p=el.dataset.page;
        ['home','meals','bowel','walk'].forEach(k=>view[k]=view.home||todayStr());
        go(p);break;}
      case 'nav-date':{
        const p=el.dataset.page;
        const nd=addDays(view[p],+el.dataset.delta);
        if(nd<=todayStr()){view[p]=nd;render(p)}
        break;}
      case 'goto-today':
        ['home','meals','bowel','walk'].forEach(k=>view[k]=todayStr());
        render(el.dataset.page);break;
      case 'open-cal':openCalSheet(el.dataset.page);break;
      case 'cal-shift':calShift(+el.dataset.delta,el.dataset.page);break;
      case 'cal-day':{
        const d=el.dataset.d;
        ['home','meals','bowel','walk'].forEach(k=>view[k]=d);
        closeSheet();render(cur);break;}
      case 'cal-today':{
        ['home','meals','bowel','walk'].forEach(k=>view[k]=todayStr());
        closeSheet();render(cur);break;}
      case 'edit-journal':openJournalSheet(el.dataset.date||todayStr());break;
      case 'open-meal':openMealSheet(null,view.meals,el.dataset.type);break;
      case 'open-meal-t':openMealSheet(null,todayStr(),el.dataset.type);break;
      case 'edit-meal':openMealSheet(findById('meals',id));break;
      case 'del-meal':confirmDel('meals',id);break;
      case 'open-weight':openWeightSheet(null,view.meals);break;
      case 'open-weight-t':openWeightSheet(null,cur==='home'?(view.home||todayStr()):todayStr());break;
      case 'edit-weight':openWeightSheet(findById('weights',id));break;
      case 'del-weight':confirmDel('weights',id);break;
      case 'open-bowel':openBowelSheet(null,view.bowel);break;
      case 'open-bowel-t':openBowelSheet(null,todayStr());break;
      case 'edit-bowel':openBowelSheet(findById('bowels',id));break;
      case 'del-bowel':confirmDel('bowels',id);break;
      case 'open-walk':openWalkSheet(null,view.walk);break;
      case 'open-walk-t':openWalkSheet(null,todayStr());break;
      case 'edit-walk':openWalkSheet(findById('walks',id));break;
      case 'del-walk':confirmDel('walks',id);break;
      case 'open-daily':openDailySheet(cur==='walk'?view.walk:(cur==='home'?(view.home||todayStr()):todayStr()));break;
      case 'edit-daily':openDailySheet(findById('dailies',id).date);break;
      case 'del-daily':confirmDel('dailies',id);break;
      case 'edit-any':{
        const t=el.dataset.type,r=findById(t,id);
        if(!r)break;
        if(t==='meals')openMealSheet(r);
        else if(t==='weights')openWeightSheet(r);
        else if(t==='bowels')openBowelSheet(r);
        else if(t==='dailies')openDailySheet(r.date);
        else if(t==='journals')openJournalSheet(r.date);
        else openWalkSheet(r);
        break;}
      case 'del-any':confirmDel(el.dataset.type,id);break;
      case 'browse-type':state.browse=el.dataset.v;renderData();break;
      case 'set-goal':db.settings.stepGoal=+el.dataset.v;db.settings.updatedAt=Date.now();save();renderData();toast('每日目标已更新');break;
      case 'export':exportData();break;
      case 'import':{const f=$('#importFile');if(f)f.click();break;}
      case 'demo':genDemo();break;
      case 'sync-gen':syncGen();break;
      case 'sync-bind':syncBind();break;
      case 'sync-now':syncNow(true);break;
      case 'sync-copy':copySyncCode();break;
      case 'sync-rotate':syncRotate();break;
      case 'sync-off':syncOff();break;
      case 'clear':confirmDialog({title:'清空全部记录',msg:'将删除全部三餐、体重、排便、步行、手表数据和小记（昵称、身高等设置会保留），此操作无法撤销。若已开启云同步，删除也会同步到其他设备。',okText:'全部删除',danger:true,
        onOk:()=>{
          TYPES.forEach(t=>db[t].forEach(r=>{if(!r.updatedAt)r.updatedAt=Date.now();db.deleted.push({id:r.id,at:Date.now()})}));
          TYPES.forEach(t=>db[t]=[]);
          if(db.deleted.length>500)db.deleted=db.deleted.slice(-400);
          save();render(cur);toast('已清空');
        }});break;
    }
    return;
  }
  /* chip / bristol 单选 */
  const chip=e.target.closest('.chip[data-v],.br-item[data-v]');
  if(chip){
    const par=chip.parentElement;
    par.querySelectorAll(':scope > .chip, :scope > .br-item').forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
    if(par.id==='bType'){const h=$('#brHint');if(h)h.innerHTML=bristolHint(+chip.dataset.v)}
    if(par.id==='bColor'){const w=$('#bWarn');if(w)w.hidden=!BCOLOR.find(c=>c.v===chip.dataset.v&&c.warn)}
  }
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='importFile'){doImport(e.target);return}
  if(id==='setNick'){db.settings.nickname=e.target.value.trim().slice(0,12);db.settings.updatedAt=Date.now();save();toast('已保存');return}
  if(id==='setHeight'){
    const v=+e.target.value;
    if(!(v>=50&&v<=260)){toast('身高请在 50 – 260 cm 之间','warn');e.target.value=db.settings.height||'';return}
    db.settings.height=Math.round(v);db.settings.updatedAt=Date.now();save();renderData();toast('身高已保存');return;
  }
  if(id==='setGoal'){
    const v=+e.target.value;
    if(!(v>=500&&v<=100000)){toast('目标范围 500 – 100000 步','warn');e.target.value=db.settings.stepGoal;return}
    db.settings.stepGoal=Math.round(v);db.settings.updatedAt=Date.now();save();renderData();toast('目标已更新');return;
  }
});
/* 同步码输入框回车绑定 */
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='syncCodeInput'){e.preventDefault();syncBind()}
});
/* 锻炼 sheet：配速实时计算；小记：字数统计 */
sheetRoot.addEventListener('input',e=>{
  if(e.target.id==='wMins'||e.target.id==='wKm'){
    const p=$('#wPace');
    if(p)p.textContent=fmtPace(+($('#wMins')?$('#wMins').value:0)||0,+($('#wKm')?$('#wKm').value:0)||0);
  }
  if(e.target.id==='jText'){
    const c=$('#jCnt');
    if(c)c.textContent=e.target.value.length;
  }
});

/* ================= 启动 ================= */
/* 旧版步行数据迁移：纯步数记录折算为每日手表汇总 */
function migrateWalks(){
  if(!Array.isArray(db.dailies))db.dailies=[];
  const daySteps={};
  let changed=false;
  db.walks.forEach(w=>{
    if('steps' in w){
      if(+w.steps>0)daySteps[w.date]=(daySteps[w.date]||0)+Math.round(+w.steps);
      delete w.steps;
      w.km=+w.km||0;w.mins=+w.mins||0;
      changed=true;
    }
  });
  if(!changed)return false;
  db.walks=db.walks.filter(w=>w.mins>0||w.km>0||(w.note&&w.note.trim()));
  for(const[ds,steps]of Object.entries(daySteps)){
    if(!db.dailies.some(x=>x.date===ds))db.dailies.push({id:uid(),date:ds,updatedAt:Date.now(),steps,kcal:null});
  }
  return true;
}
$('#nav').innerHTML=[['home','首页','home'],['meals','三餐','meal'],['bowel','排便','poop'],['walk','步行','walk'],['data','数据','data']]
  .map(([p,n,i])=>`<button type="button" class="nav-item${p==='home'?' active':''}" data-act="goto" data-page="${p}" aria-label="${n}">${ic(i)}<span>${n}</span></button>`).join('');
migrateDB();
if(migrateWalks())save();
go('home');
/* 已开启云同步：启动 1 秒后自动拉取一次 */
setTimeout(()=>{if(syncConf)syncNow()},1000);
/* 回到前台时（超过 30 秒未同步）自动对齐一次 */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&syncConf&&Date.now()-(syncConf.lastSync||0)>30e3){
    setTimeout(()=>{if(!document.hidden&&syncConf)syncNow()},600);
  }
});
